<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>G1D 臂控</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="viewer">
  <canvas id="scene3d"></canvas>
  <div class="legend">
    <span><i class="swatch solid"></i>实测</span>
    <span><i class="swatch cmd"></i>指令</span>
    <span><i class="swatch tgt"></i>目标</span>
    <span><i class="swatch pay"></i>负载质心</span>
    <span class="legend-ops">拖动旋转 · 右键平移 · 滚轮缩放 · 双击复位</span>
  </div>
</div>

<header class="hud">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <h1>G1D 臂控</h1>
      <p id="meta" class="meta">等待低层状态</p>
    </div>
  </div>
  <div id="msg">推实物手臂对照 3D。发令需用 --allow-real-motion 启动，并点接管。</div>
  <div class="mast-status">
    <span id="mode-badge" class="badge ro">…</span>
    <span id="pill" class="pill">连接中…</span>
  </div>
</header>

<nav class="dock" id="ctrl-group">
  <label class="field slim">视图
    <select id="arm-select">
      <option value="right">右臂</option>
      <option value="left">左臂</option>
      <option value="both">双臂</option>
    </select>
  </label>
  <label class="field slim">控制臂
    <select id="control-arm">
      <option value="right">右</option>
      <option value="left">左</option>
    </select>
  </label>
  <label class="switch"><input id="grav-on" type="checkbox" checked><span>重力前馈</span></label>
  <button id="btn-engage" class="primary">接管</button>
  <button id="btn-teach">拖拽</button>
  <button id="btn-hold" class="danger">急停(保持)</button>
  <button id="btn-release">释放</button>
  <label class="field slim">限速
    <input id="speed" type="number" step="0.05" min="0.02" max="1.0" value="0.2">
  </label>
  <button id="btn-speed">设</button>
  <button id="btn-fill">填入当前角</button>
  <button id="btn-goto" class="primary">出发</button>
  <div id="engage-state" class="state"></div>
</nav>

<aside class="floats">
  <details class="float">
    <summary>关节</summary>
    <div class="float-body">
      <p class="note">视图所选；双臂时显示控制臂</p>
      <div class="table-scroll">
        <table id="joints-table">
          <thead>
            <tr><th>关节</th><th>电机</th><th>q (deg)</th><th>dq</th><th>τ_est</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </details>

  <details class="float" id="panel-motion">
    <summary>单点角度</summary>
    <div class="float-body">
      <div class="still" title="测量/走点到达后等实测角停住。窗口内 max|dq| 小于速度阈，且位置峰峰值小于漂移阈。">
        <label class="field">速度阈
          <input id="still-dq" type="number" step="0.005" min="0.02" value="0.05">
        </label>
        <label class="field">漂移阈
          <input id="still-drift" type="number" step="0.001" min="0.002" value="0.01">
        </label>
        <label class="field">窗口 s
          <input id="still-win" type="number" step="0.1" min="0.2" value="0.5">
        </label>
        <label class="field">超时 s
          <input id="still-to" type="number" step="0.5" min="2" value="8">
        </label>
        <button id="btn-still">设置</button>
      </div>
      <div class="q-grid" id="goto-inputs"></div>
    </div>
  </details>

  <!-- payload-panels -->
</aside>
<script src="/static/app.js"></script>
<script src="/static/payload.js"></script>
</body>
</html>
